name: investing-r2c2-pg17
on:
  pull_request:
    paths:
      - "investing-core/**"
      - "app/investing/start/**"
      - "app/api/investing/portfolio/**"
      - "supabase/release-candidates/20261023063000_r2c2_first_portfolio.sql"
      - ".github/workflows/investing-r2c2-pg17.yml"
      - "package.json"
permissions:
  contents: read
jobs:
  first-portfolio-postgresql17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syntrake_r2c2_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d syntrake_r2c2_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Strict investing contracts
        run: |
          npm run test:investing
          npx tsc -p tsconfig.investing.json --noEmit
      - name: Real isolated PostgreSQL 17 initial account, A/B, replay and concurrency
        run: |
          npx tsx --test investing-core/tests/pg17-r2c2-initial-portfolio.test.ts
          npx tsx --test investing-core/tests/pg17-r2c2-jwt-rpc.test.ts
        env:
          INVESTING_PG17_R2C2_URL: postgresql://postgres:postgres@127.0.0.1:5432/syntrake_r2c2_ci
