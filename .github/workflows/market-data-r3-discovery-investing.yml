name: market-data-r3-discovery-investing

on:
  push:
    paths:
      - 'market-data-core/discoveryMarketDataInvesting.ts'
      - 'market-data-core/tests/discovery-market-data-investing.test.ts'
      - 'market-data-core/catalogOnboarding.ts'
      - 'market-data-core/twelveDataCatalog.ts'
      - 'market-data-core/canonicalIdentityResolver.ts'
      - 'market-data-core/providerRouter.ts'
      - 'market-data-core/twelveDataProvider.ts'
      - 'package.json'
      - '.github/workflows/market-data-r3-discovery-investing.yml'
  pull_request:
    paths:
      - 'market-data-core/discoveryMarketDataInvesting.ts'
      - 'market-data-core/tests/discovery-market-data-investing.test.ts'
      - 'market-data-core/catalogOnboarding.ts'
      - 'market-data-core/twelveDataCatalog.ts'
      - 'market-data-core/canonicalIdentityResolver.ts'
      - 'market-data-core/providerRouter.ts'
      - 'market-data-core/twelveDataProvider.ts'
      - 'package.json'
      - '.github/workflows/market-data-r3-discovery-investing.yml'

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck:market-data
      - run: npm run test:market-data:r3-discovery-investing
      - run: npm run test:market-data:d2
      - run: npm run test:market-data:d3
      - run: npm run test:market-data:d4
      - run: npm run test:market-data:d5
      - run: npm run test:market-data:d6a:pg17
