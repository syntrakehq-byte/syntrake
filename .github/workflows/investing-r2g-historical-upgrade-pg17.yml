name: investing-r2g-historical-upgrade-pg17
on:
  pull_request:
    paths:
      - "investing-core/**"
      - "supabase/release-candidates/20261024190500_r2_preview_import_coverage_forward_compat.sql"
      - ".github/workflows/investing-r2g-historical-upgrade-pg17.yml"
permissions:
  contents: read
jobs:
  real-historical-schema-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syntrake_r2g_history_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d syntrake_r2g_history_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - name: Upgrading REAL legacy candidate schema and preserving synthetic financial truth
        run: npx tsx --test investing-core/tests/pg17-r2g-historical-forward.test.ts
        env:
          INVESTING_PG17_R2G_HISTORICAL_URL: postgresql://postgres:postgres@127.0.0.1:5432/syntrake_r2g_history_ci
