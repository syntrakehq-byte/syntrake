name: investing-release-supabase-cli-pg17

on:
  pull_request:
    paths:
      - 'investing-core/releases/**'
      - 'supabase/release-candidates/**'
      - '.github/workflows/investing-release-supabase-cli-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-supabase-cli:
    name: Supabase CLI dry-run and apply, disposable PostgreSQL 17 only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syntrake_cli_rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d syntrake_cli_rehearsal"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: "true"
      INVESTING_RELEASE_CLI_DB_URL: "postgresql://postgres:postgres@127.0.0.1:5432/syntrake_cli_rehearsal"
      # CLI v2.84.2 reserializes --db-url and drops sslmode. Force plaintext
      # only for the loopback-only disposable PG17 fixture. NEVER use for Prod.
      PGSSLMODE: "disable"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Seed ONLY disposable local PG17 with simulated remote migration history
        run: npx tsx investing-core/releases/cliReleaseRehearsal.ts seed
      - name: Assemble isolated migration workspace, excluding all historical Git migrations and writer capability
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          ROOT="$RUNNER_TEMP/syntrake_cli_release"
          mkdir -p "$ROOT/supabase/migrations"
          # Historical source is reconstructed from the REAL Production migration
          # registry snapshot, independently fingerprinted and Git-committed.
          # Already-applied file is NOT executed. Never copy it to Production.
          npx tsx -e 'import {renderRecoveredBaselineForDisposableCI} from "./investing-core/releases/productionHistorySnapshot"; renderRecoveredBaselineForDisposableCI().then(sql => process.stdout.write(sql)).catch(() => {process.stderr.write("BLOCKED_HISTORICAL_SNAPSHOT\\n"); process.exitCode = 1;});' \
            > "$ROOT/supabase/migrations/20261017191056_remote_schema.sql"
          test -s "$ROOT/supabase/migrations/20261017191056_remote_schema.sql"
          cp supabase/release-candidates/20261020180000_investing_first_readonly_release.sql \
            "$ROOT/supabase/migrations/20261020180000_investing_first_readonly_release.sql"
          test "$(find "$ROOT/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 2
          test ! -e "$ROOT/supabase/migrations/20261018074500_investing_contribution_writer_capability.sql"
          echo "ISOLATED_RELEASE_WORKSPACE_ONLY"
      - name: Supabase CLI v2.84.2 dry run selects only one forward candidate migration
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/syntrake_cli_release"
          npx --yes supabase@2.84.2 --version
          npx --yes supabase@2.84.2 --workdir "$ROOT" db push \
            --db-url "$INVESTING_RELEASE_CLI_DB_URL?sslmode=disable" --dry-run 2>&1 | tee "$RUNNER_TEMP/cli-dryrun.txt"
          grep -q '20261020180000_investing_first_readonly_release' "$RUNNER_TEMP/cli-dryrun.txt"
          echo "ISOLATED_SUPABASE_CLI_DRY_RUN_PASS"
      - name: Supabase CLI actual push to disposable local PG17, NEVER a Supabase project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/syntrake_cli_release"
          npx --yes supabase@2.84.2 --yes --workdir "$ROOT" db push \
            --db-url "$INVESTING_RELEASE_CLI_DB_URL?sslmode=disable"
          npx tsx investing-core/releases/cliReleaseRehearsal.ts verify
      - name: Second dry-run must not propose any replay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/syntrake_cli_release"
          npx --yes supabase@2.84.2 --workdir "$ROOT" db push \
            --db-url "$INVESTING_RELEASE_CLI_DB_URL?sslmode=disable" --dry-run 2>&1 | tee "$RUNNER_TEMP/cli-replay.txt"
          if grep -Eq 'Would apply.*20261020180000|Applying migration 20261020180000' "$RUNNER_TEMP/cli-replay.txt"; then
            echo "BLOCKED: replay was proposed"
            exit 1
          fi
          npx tsx investing-core/releases/cliReleaseRehearsal.ts verify

      - name: Pin exact R2 source blobs before CLI migration rehearsal
        shell: bash
        run: npx tsx investing-core/releases/verifyR2ProductionBundle.ts verify
      - name: Assemble ALL R2 migrations from verified candidates in isolated CLI workspace
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/syntrake_cli_release"
          cp supabase/release-candidates/20261022200000_r2b_unverified_portfolio_imports.sql "$ROOT/supabase/migrations/"
          cp supabase/release-candidates/20261022210000_r2c_onboarding_intents.sql "$ROOT/supabase/migrations/"
          cp supabase/release-candidates/20261023063000_r2c2_first_portfolio.sql "$ROOT/supabase/migrations/"
          # Official CLI generates the fourth version; no invented timestamp.
          npx --yes supabase@2.84.2 --workdir "$ROOT" migration new r2_bl2bl3_canonical
          mapfile -t CANDIDATES < <(find "$ROOT/supabase/migrations" -maxdepth 1 -name '*_r2_bl2bl3_canonical.sql')
          test "${#CANDIDATES[@]}" -eq 1
          cp docs/r2/bl2bl3-candidate.sql "${CANDIDATES[0]}"
          test "$(find "$ROOT/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 6
          test ! -e "$ROOT/supabase/migrations/20261024190500_r2_preview_import_coverage_forward_compat.sql"
          test ! -e "$ROOT/supabase/migrations/20261024194500_r2_preview_revoke_legacy_provision_rpc.sql"
          test ! -e "$ROOT/supabase/migrations/20261024205500_r2_preview_import_runtime_nologin.sql"
          echo "R0_R2_CLI_BUNDLE_STAGED_IN_RUNNER_TEMP_ONLY"
      - name: Supabase CLI PG17 dry-run sees the four R2 candidates and no historical migration replay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/syntrake_cli_release"
          npx --yes supabase@2.84.2 --workdir "$ROOT" db push \
            --db-url "$INVESTING_RELEASE_CLI_DB_URL?sslmode=disable" --dry-run 2>&1 | tee "$RUNNER_TEMP/r2-cli-plan.txt"
          for n in r2b_unverified_portfolio_imports r2c_onboarding_intents r2c2_first_portfolio r2_bl2bl3_canonical; do
            grep -q "$n" "$RUNNER_TEMP/r2-cli-plan.txt"
          done
          echo "R0_R2_CLI_PLAN_PASS"
      - name: Apply four R2 migrations ONLY to loopback disposable PG17 and verify registry, security and zero ledger
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/syntrake_cli_release"
          npx --yes supabase@2.84.2 --yes --workdir "$ROOT" db push \
            --db-url "$INVESTING_RELEASE_CLI_DB_URL?sslmode=disable"
          npx tsx investing-core/releases/verifyR2CliApply.ts verify
      - name: Repeat dry-run is idempotent; no migration to replay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/syntrake_cli_release"
          npx --yes supabase@2.84.2 --workdir "$ROOT" db push \
            --db-url "$INVESTING_RELEASE_CLI_DB_URL?sslmode=disable" --dry-run 2>&1 | tee "$RUNNER_TEMP/r2-cli-idempotent.txt"
          if grep -Eq 'Would apply.*20261022|Would apply.*20261023|Would apply.*r2_bl2bl3|Applying migration 20261022|Applying migration 20261023' "$RUNNER_TEMP/r2-cli-idempotent.txt"; then
            echo "BLOCKED: attempted R2 migration replay"
            exit 1
          fi
          npx tsx investing-core/releases/verifyR2CliApply.ts verify
