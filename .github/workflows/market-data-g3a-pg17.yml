name: market-data-g3b-pg17
on:
  pull_request:
    paths: ["market-data-core/investingOperationalService.ts", "market-data-core/tests/g3a-operational.test.ts", "market-data-core/tests/g3b-autonomous-pg17.test.ts", "market-data-core/tests/r3c-offline-e2e-pg17.test.ts", "market-data-core/tests/r3d2-pg17.test.ts", "market-data-core/tests/d5-integrated-pg17.test.ts", "package.json", ".github/workflows/market-data-g3a-pg17.yml"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  g3a-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run typecheck:market-data
      - run: npm run test:market-data:g3b:pg17
