name: investing-core

on:
  pull_request:
  push:
    branches: [main]

jobs:
  financial-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:investing
      - run: npx tsc -p tsconfig.investing.json --noEmit

  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syntrake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d syntrake_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:investing:pg17
        env:
          INVESTING_PG17_URL: postgresql://postgres:postgres@127.0.0.1:5432/syntrake_test
