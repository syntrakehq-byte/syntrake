name: news-core

on:
  push:
    paths:
      - "news-core/**"
      - "scripts/news-poll.ts"
      - "docs/news/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/news-core.yml"
  pull_request:
    paths:
      - "news-core/**"
      - "scripts/news-poll.ts"
      - "docs/news/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/news-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:news
      - run: npx tsc --noEmit
