name: news-core

on:
  push:
    paths:
      - "news-core/**"
      - "scripts/news-poll.ts"
      - "scripts/news-postgres-worker.ts"
      - "supabase/migrations/*.sql"
      - "docs/news/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/news-core.yml"
  pull_request:
    paths:
      - "news-core/**"
      - "scripts/news-poll.ts"
      - "scripts/news-postgres-worker.ts"
      - "supabase/migrations/*.sql"
      - "docs/news/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/news-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        options: >-
          --health-cmd "pg_isready -U postgres -d syntrake_news_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syntrake_news_ci
        ports:
          - 5432:5432
    env:
      NEWS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/syntrake_news_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Enable PostgreSQL commit timestamps for strict PIT tests
        shell: bash
        run: |
          cid="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$cid"
          docker exec "$cid" psql -U postgres -d syntrake_news_ci -v ON_ERROR_STOP=1 -c "alter system set track_commit_timestamp = on"
          docker restart "$cid"
          for i in $(seq 1 30); do docker exec "$cid" pg_isready -U postgres -d syntrake_news_ci >/dev/null 2>&1 && break; sleep 1; done
          docker exec "$cid" psql -U postgres -d syntrake_news_ci -Atc "show track_commit_timestamp" | grep -qx on
      - run: npm run test:news
      - run: npm run test:news:n3a
      - run: npm run test:news:n3b
      - run: npm run test:news:pg17
      - run: npm run test:news:n3d
      - run: npm run test:news:bl3
        env:
          SEC_USER_AGENT: "SYNTRAKE BL3 CI/1.0 security@syntrake.com"
      - run: npm run test:news:n4
      - run: npm run test:news:n4:pg17
      - run: npm run test:news:n4:live
        env:
          N4_REAL_SOURCE: "1"
          SEC_USER_AGENT: "SYNTRAKE N4 CI/1.0 security@syntrake.com"
      - run: npm run test:news:n5
      - run: npm run test:news:n5:pg17
      - run: npm run test:news:n5:live
        env:
          N5_REAL_SOURCE: "1"
          SEC_USER_AGENT: "SYNTRAKE N5 CI/1.0 security@syntrake.com"
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
