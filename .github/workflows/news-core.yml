name: news-core

on:
  push:
    paths:
      - "news-core/**"
      - "scripts/news-poll.ts"
      - "scripts/news-postgres-worker.ts"
      - "scripts/news-supervisor.ts"
      - "supabase/migrations/*.sql"
      - "docs/news/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/news-core.yml"
  pull_request:
    paths:
      - "news-core/**"
      - "scripts/news-poll.ts"
      - "scripts/news-postgres-worker.ts"
      - "scripts/news-supervisor.ts"
      - "supabase/migrations/*.sql"
      - "docs/news/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/news-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        options: >-
          --health-cmd "pg_isready -U postgres -d syntrake_news_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syntrake_news_ci
        ports:
          - 5432:5432
    env:
      NEWS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/syntrake_news_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Enable PostgreSQL commit timestamps for strict PIT tests
        shell: bash
        run: |
          cid="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$cid"
          docker exec "$cid" psql -U postgres -d syntrake_news_ci -v ON_ERROR_STOP=1 -c "alter system set track_commit_timestamp = on"
          docker restart "$cid"
          for i in $(seq 1 30); do docker exec "$cid" pg_isready -U postgres -d syntrake_news_ci >/dev/null 2>&1 && break; sleep 1; done
          docker exec "$cid" psql -U postgres -d syntrake_news_ci -Atc "show track_commit_timestamp" | grep -qx on
      - run: npm run test:news
      - name: Global News adapters and source isolation
        run: npx tsx --test news-core/tests/globalNewsAdapter.test.ts news-core/tests/globalNewsPoller.test.ts news-core/tests/globalNewsRegistry.test.ts news-core/tests/globalNewsXml.test.ts news-core/tests/globalNewsCollector.test.ts news-core/tests/globalNewsFactualN4.test.ts news-core/tests/globalNewsPitSelectionN4.test.ts
      - name: Global News official RSS rehearsal
        env:
          RUN_GLOBAL_NEWS_LIVE: "1"
          SEC_USER_AGENT: "SYNTRAKE Global News CI/1.0 security@syntrake.com"
        run: npx tsx --test --test-timeout=120000 news-core/tests/globalNewsLive.test.ts
      - run: npm run test:news:n3a
      - run: npm run test:news:n3b
      - run: npm run test:news:pg17
      - name: Global News PostgreSQL N-G3 persistence and PIT
        env:
          NEWS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syntrake_news_ci
        run: npx tsx --test --test-timeout=180000 news-core/tests/postgresNewsGlobalN3.test.ts
      - name: Global News PostgreSQL N-G5 identity and editorial PIT
        env:
          NEWS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syntrake_news_ci
        run: npx tsx --test --test-timeout=180000 news-core/tests/postgresNewsGlobalN5.test.ts
      - run: npm run test:news:n3d
      - run: npm run test:news:bl3
        env:
          SEC_USER_AGENT: "SYNTRAKE BL3 CI/1.0 security@syntrake.com"
      - run: npm run test:news:bl3:operational
        env:
          SEC_USER_AGENT: "SYNTRAKE BL3 operational CI/1.0 security@syntrake.com"
      - run: npm run test:news:bl4:supervisor
        env:
          SEC_USER_AGENT: "SYNTRAKE BL4 supervisor CI/1.0 security@syntrake.com"
      - run: npm run test:news:bl4:factual
        env:
          SEC_USER_AGENT: "SYNTRAKE BL4 factual supervisor CI/1.0 security@syntrake.com"
      - run: npm run test:news:n4
      - run: npm run test:news:n4:pg17
      - run: npm run test:news:n4:live
        env:
          N4_REAL_SOURCE: "1"
          SEC_USER_AGENT: "SYNTRAKE N4 CI/1.0 security@syntrake.com"
      - run: npm run test:news:n5
      - name: Global News N-G6 versioned read API and rights boundary
        run: npm run test:news:ng6
      - name: Global News N-G6 PostgreSQL 17 PIT, rights and consumer recovery
        run: npm run test:news:ng6:pg17
      - run: npm run test:news:n5:pg17
      - run: npm run test:news:n5:live
        env:
          N5_REAL_SOURCE: "1"
          SEC_USER_AGENT: "SYNTRAKE N5 CI/1.0 security@syntrake.com"
      - run: npm run test:news:n0:consolidated
      - name: N0-T03 verified 25-publication manifest gate (no skip)
        env:
          N0_T03_MANIFEST: news-core/tests/fixtures/n0-t03-crowdstrike-2024-07-19.json
        run: npx tsx --test news-core/tests/n0T03EditorialAcceptance.test.ts
      - run: npm run test:news:n0:t27
        env:
          SEC_USER_AGENT: "SYNTRAKE N0 T27 CI/1.0 security@syntrake.com"
      - run: npm run test:news:n0:t20
      - run: npm run test:news:n0:contracts
      - name: Checkout real Market Core branch for T33 PIT integration
        uses: actions/checkout@v4
        with:
          ref: feat/r3-g1-universal-market-contract-20261102
          path: .market-contract-checkout-pit
          persist-credentials: false
      - name: T33 joint Market and News PIT rehearsal
        shell: bash
        env:
          N0_MARKET_CORE_CHECKOUT: ${{ github.workspace }}/.market-contract-checkout-pit
        run: |
          trap 'rm -rf .market-contract-checkout-pit' EXIT
          npx tsx --test --test-timeout=180000 news-core/tests/marketNewsPitIntegrationN0.test.ts
      - name: Checkout real Market Core contract branch for T33
        uses: actions/checkout@v4
        with:
          ref: feat/r3-g1-universal-market-contract-20261102
          path: .market-contract-checkout
          persist-credentials: false
      - name: T33 cross-branch contract rehearsal (not production PIT certification)
        shell: bash
        env:
          N0_MARKET_CORE_CHECKOUT: ${{ github.workspace }}/.market-contract-checkout
        run: |
          trap 'rm -rf .market-contract-checkout' EXIT
          npx tsx --test news-core/tests/marketCrossBranchN0.test.ts
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
