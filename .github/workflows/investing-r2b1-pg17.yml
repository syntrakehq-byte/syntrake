name: investing-r2b1-pg17

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - "investing-core/**"
      - "supabase/release-candidates/20261022200000_r2b_unverified_portfolio_imports.sql"
      - ".github/workflows/investing-r2b1-pg17.yml"

permissions:
  contents: read

jobs:
  import-snapshot-isolated-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syntrake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d syntrake_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: R2-B1 real isolated PostgreSQL 17 (NO remote credentials)
        run: npx tsx --test investing-core/tests/pg17-r2b-import.test.ts
        env:
          INVESTING_PG17_R2B_URL: postgresql://postgres:postgres@127.0.0.1:5432/syntrake_test
