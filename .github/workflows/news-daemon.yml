name: news-daemon-image

on:
  push:
    paths:
      - "Dockerfile.news-daemon"
      - "Dockerfile.news-daemon.dockerignore"
      - "vercel.daemons.example.toml"
      - "scripts/news-supervisor.ts"
      - "scripts/news-postgres-worker.ts"
      - "news-core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/news-daemon.yml"
  pull_request:
    paths:
      - "Dockerfile.news-daemon"
      - "Dockerfile.news-daemon.dockerignore"
      - "vercel.daemons.example.toml"
      - "scripts/news-supervisor.ts"
      - "scripts/news-postgres-worker.ts"
      - "news-core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/news-daemon.yml"

jobs:
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syntrake_news_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d syntrake_news_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      NEWS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/syntrake_news_ci
      SEC_USER_AGENT: "SYNTRAKE daemon image CI/1.0 security@syntrake.com"
    steps:
      - uses: actions/checkout@v4
      - name: Enable PostgreSQL commit timestamps for strict PIT tests
        shell: bash
        run: |
          cid="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$cid"
          docker exec "$cid" psql -U postgres -d syntrake_news_ci -v ON_ERROR_STOP=1 -c "alter system set track_commit_timestamp = on"
          docker restart "$cid"
          for i in $(seq 1 30); do docker exec "$cid" pg_isready -U postgres -d syntrake_news_ci >/dev/null 2>&1 && break; sleep 1; done
          docker exec "$cid" psql -U postgres -d syntrake_news_ci -Atc "show track_commit_timestamp" | grep -qx on
      - name: Verify Dockerfile-specific ignore with adversarial canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .docker-canary
          printf 'synthetic-secret\n' > .docker-canary/.env
          cat > Dockerfile.news-daemon-canary-audit <<'EOF'
          FROM scratch
          COPY .docker-canary/.env /canary
          EOF
          cp Dockerfile.news-daemon.dockerignore Dockerfile.news-daemon-canary-audit.dockerignore
          set +e
          docker build --file Dockerfile.news-daemon-canary-audit --tag syntrake-news-canary:${{ github.sha }} . >/tmp/news-daemon-canary.log 2>&1
          status=$?
          set -e
          cat /tmp/news-daemon-canary.log
          test "$status" -ne 0
          rm -f Dockerfile.news-daemon-canary-audit Dockerfile.news-daemon-canary-audit.dockerignore
          rm -rf .docker-canary
      - name: Build News Core daemon image
        run: docker build --file Dockerfile.news-daemon --tag syntrake-news-daemon:${{ github.sha }} .
      - name: Verify runtime and worker modules
        run: |
          docker run --rm --entrypoint node syntrake-news-daemon:${{ github.sha }} --version
          docker run --rm --entrypoint node syntrake-news-daemon:${{ github.sha }} -e "require('pg'); require('tsx')"
      - name: Verify factual mode fails closed without segregated capabilities
        shell: bash
        run: |
          set +e
          output="$(docker run --rm \
            -e NEWS_DATABASE_URL="$NEWS_DATABASE_URL" \
            -e SEC_USER_AGENT="$SEC_USER_AGENT" \
            --entrypoint node syntrake-news-daemon:${{ github.sha }} \
            node_modules/tsx/dist/cli.mjs scripts/news-postgres-worker.ts 2>&1)"
          status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q 'NEWS_FACTUAL_PIPELINE_CONFIG_INCOMPLETE'
      - name: Verify image contains no environment files
        run: |
          test "$(docker run --rm --entrypoint node syntrake-news-daemon:${{ github.sha }} -e "const fs=require('fs'); process.stdout.write(fs.existsSync('/app/.env') ? 'bad' : 'ok')")" = ok
      - name: Prepare PG17 schema and least-privilege N1 role
        run: |
          npm ci
          npm run test:news:pg17
          docker run --rm --network host postgres:17 psql "$NEWS_DATABASE_URL" -v ON_ERROR_STOP=1 -c "do \$\$ begin if not exists (select 1 from pg_roles where rolname='news_daemon_test') then create role news_daemon_test login password 'news-daemon-test-password' nocreatedb nocreaterole; end if; end \$\$; grant news_service to news_daemon_test;"
      - name: Run real daemon entrypoint with PG17 and restart container
        shell: bash
        run: |
          set -euo pipefail
          name="news-daemon-${GITHUB_RUN_ID}"
          scope="sec-edgar|sec|cik=0000320193|forms=10-K,10-Q,8-K,20-F,6-K|overlap=7|v=2"
          db_url="postgres://news_daemon_test:news-daemon-test-password@localhost:5432/syntrake_news_ci?options=-c%20role%3Dnews_service"
          docker run --rm --network host postgres:17 psql "$NEWS_DATABASE_URL" -v ON_ERROR_STOP=1 -c "delete from news_core.executions where collection_scope_key='$scope'; delete from news_core.collection_targets where collection_scope_key='$scope'; delete from news_core.checkpoints where collection_scope_key='$scope';"
          baseline="$(docker run --rm --network host postgres:17 psql "$NEWS_DATABASE_URL" -Atc "select count(*) from news_core.checkpoints where collection_scope_key='$scope'")"
          test "$baseline" = 0
          cid="$(docker run -d --name "$name" \
            -e NEWS_DATABASE_URL="$db_url" \
            -e SEC_USER_AGENT="$SEC_USER_AGENT" \
            -e NEWS_EXECUTION_MODE=N1_ONLY \
            -e SEC_CIK=0000320193 \
            -e NEWS_POLL_INTERVAL_MS=100 \
            -e NEWS_LEASE_SECONDS=5 \
            syntrake-news-daemon:${{ github.sha }})"
          ready=0
          for i in $(seq 1 60); do
            logs="$(docker logs "$cid" 2>&1 || true)"
            printf '%s\n' "$logs" | grep -q 'NEWS_WORKER_READY' && ready=1 && break
            sleep 1
          done
          test "$ready" -eq 1
          for i in $(seq 1 60); do
            count="$(docker run --rm --network host postgres:17 psql "$NEWS_DATABASE_URL" -Atc "select count(*) from news_core.checkpoints where collection_scope_key='$scope'")"
            test "$count" -ge 1 && break
            sleep 1
          done
          test "$count" -ge 1
          docker stop --time 15 "$cid"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$cid")" = 0
          docker start "$cid" >/dev/null
          restarted=0
          for i in $(seq 1 30); do
            logs="$(docker logs "$cid" 2>&1 || true)"
            test "$(printf '%s\n' "$logs" | grep -c 'NEWS_WORKER_READY')" -ge 2 && restarted=1 && break
            sleep 1
          done
          test "$restarted" -eq 1
          after="$(docker run --rm --network host postgres:17 psql "$NEWS_DATABASE_URL" -Atc "select count(*) from news_core.checkpoints where collection_scope_key='$scope'")"
          test "$after" = 1
          docker stop --time 15 "$cid" >/dev/null || true
          docker logs "$cid"
          docker rm "$cid" >/dev/null
      - name: Run existing PG17 supervisor smoke suite
        run: |
          npm run test:news:bl4:supervisor
