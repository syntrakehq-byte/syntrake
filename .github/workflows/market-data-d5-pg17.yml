name: market-data-d5-pg17

on:
  push:
    paths: ["market-data-core/**", "supabase/release-candidates/**", "package.json", ".github/workflows/market-data-d5-pg17.yml"]
  pull_request:
    paths: ["market-data-core/**", "supabase/release-candidates/**", "package.json", ".github/workflows/market-data-d5-pg17.yml"]

jobs:
  d5:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck:market-data
      - run: npm run test:market-data:d5
      - run: npm run test:market-data:d4
      - run: npm run test:market-data:d3
      - run: npm run test:market-data:d2
      - run: npm run test:market-data
