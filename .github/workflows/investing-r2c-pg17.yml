name: investing-r2c-pg17

on:
  pull_request:
    paths:
      - "investing-core/**"
      - "app/investing/start/**"
      - "app/api/investing/onboarding/**"
      - "supabase/release-candidates/20261022210000_r2c_onboarding_intents.sql"
      - ".github/workflows/investing-r2c-pg17.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  investing-onboarding-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syntrake_r2c_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d syntrake_r2c_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: R2-C deterministic HTTP/contract tests
        run: |
          npm run test:investing
          npx tsc -p tsconfig.investing.json --noEmit
      - name: R2-C database grants RLS owner isolation and append-only history
        run: npx tsx --test investing-core/tests/pg17-r2c-onboarding.test.ts
        env:
          INVESTING_PG17_R2C_URL: postgresql://postgres:postgres@127.0.0.1:5432/syntrake_r2c_ci
