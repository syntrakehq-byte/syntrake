name: investing-release-readonly-pg17

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'investing-core/**'
      - 'supabase/migrations/**'
      - 'supabase/release-candidates/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/investing-release-readonly-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-release-rehearsal:
    name: Isolated PG17 first-release read-only contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syntrake_release_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d syntrake_release_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Execute only foundation + owner guard, never financial writer
        run: npm run test:investing:pg17:readonly
        env:
          INVESTING_PG17_READONLY_URL: postgresql://postgres:postgres@127.0.0.1:5432/syntrake_release_test
