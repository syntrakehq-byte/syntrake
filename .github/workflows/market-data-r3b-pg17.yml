name: market-data-r3b-pg17
on:
  pull_request:
    paths:
      - "supabase/release-candidates/**"
      - "market-data-core/tests/r3b-pg17.test.ts"
      - ".github/workflows/market-data-r3b-pg17.yml"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d682002
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Assert PostgreSQL 17 is available
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -d postgres -tAc 'SHOW server_version_num' | tr -d ' ')" = 170000
        env: { PGPASSWORD: postgres }
      - run: npm run test:market-data:r3b
